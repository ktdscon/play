<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kt ds 컨소시엄 교실 영상</title>
<meta name="description" content="kt ds 국가인적자원개발컨소시엄 교육 오프닝·클로징 영상 재생">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --red:#E5002B; --ink:#18171C; --gray:#707078; --box:#ECECEE; --bg:#fff; --card:#fff; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 24px 72px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:26px;letter-spacing:-.02em}
  .logo b{color:var(--red)}
  .sub{color:var(--gray);font-size:15px}
  h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.03em;margin:22px 0 6px}
  .lead{color:var(--gray);font-size:17px;margin:0 0 34px;line-height:1.6}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
  .card{border:2px solid var(--box);border-radius:20px;padding:28px 26px 24px;background:var(--card);
        text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit;
        transition:border-color .15s,transform .15s}
  .card:hover,.card:focus-visible{border-color:var(--red);transform:translateY(-2px);outline:none}
  .tag{display:inline-block;font-size:13px;font-weight:700;padding:6px 13px;border-radius:99px;
       background:var(--red);color:#fff}
  .tag.gray{background:var(--box);color:var(--ink)}
  .card h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:16px 0 6px}
  .card p{margin:0;color:var(--gray);font-size:15px;line-height:1.65}
  .meta{margin-top:18px;padding-top:16px;border-top:1px solid var(--box);
        display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--gray)}
  .play{font-weight:800;color:var(--red)}

  #picker,#mpicker{display:none;margin-top:34px;border-top:2px solid var(--box);padding-top:28px}
  #picker.on,#mpicker.on{display:block}
  #picker h3,#mpicker h3{font-size:22px;font-weight:800;margin:0 0 4px}
  #picker .hint,#mpicker .hint{color:var(--gray);font-size:15px;margin:0 0 18px;line-height:1.6}
  #q,#mq{width:100%;padding:15px 18px;border:2px solid var(--box);border-radius:14px;font:inherit;
     background:var(--card);color:inherit;margin-bottom:16px}
  #q:focus,#mq:focus{outline:none;border-color:var(--red)}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .item{border:2px solid var(--box);border-radius:14px;padding:16px 18px;background:var(--card);
        text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s}
  .item:hover,.item:focus-visible{border-color:var(--red);outline:none}
  .item b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .item span{display:block;color:var(--gray);font-size:14px;margin-top:4px}
  .empty{color:var(--gray);font-size:15px;padding:10px 2px}
  .mcourse{border:2px solid var(--box);border-radius:14px;padding:18px 20px;margin-bottom:10px}
  .mcourse b{display:block;font-size:16px;font-weight:700;margin-bottom:10px}
  .mfile{display:flex;align-items:center;justify-content:space-between;gap:12px;
         padding:10px 0;border-top:1px solid var(--box)}
  .mfile:first-of-type{border-top:none}
  .mfile span{font-size:14px;color:var(--gray)}
  .mfile a{font-weight:700;color:var(--red);text-decoration:none;white-space:nowrap}
  .mfile a:hover{text-decoration:underline}

  .note{margin-top:42px;font-size:14px;color:var(--gray);line-height:1.85}
  .note b{color:var(--ink)}
  .note a{color:var(--red)}
  kbd{background:var(--box);border-radius:6px;padding:2px 7px;font-size:13px;font-family:inherit}

  #stage{position:fixed;inset:0;background:#000;display:none;z-index:99}
  #stage.on{display:block}
  #stage video{width:100%;height:100%;object-fit:contain;background:#000}
  #close{position:fixed;top:18px;right:18px;z-index:100;border:0;border-radius:99px;
         background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:700;
         padding:11px 20px;cursor:pointer;opacity:0;transition:opacity .2s}
  #stage:hover #close,#close:focus-visible{opacity:1}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#101014;--ink:#F3F3F5;--box:#2A2A31;--gray:#9A9AA4;--card:#17171C}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">kt<b>ds</b> University</span>
    <span class="sub">국가인적자원개발컨소시엄</span>
  </header>

  <h1>교실 영상</h1>
  <p class="lead">
    강의실 PC에서 이 주소만 열면 오프닝·클로징을 바로 틀 수 있습니다.<br>
    카드를 누르면 전체화면으로 재생됩니다. 끝내려면 <kbd>Esc</kbd>.
  </p>

  <div class="cards">
    <button class="card" id="btn-open">
      <span class="tag">수업 시작 전</span>
      <h2>오프닝</h2>
      <p>컨소시엄 소개와 출결·시설 안내.<br>입실 시간에 한 번 재생합니다.</p>
      <div class="meta"><span>1분 24초 · 소리 있음</span><span class="play">재생 ▶</span></div>
    </button>

    <button class="card" id="btn-close">
      <span class="tag gray">쉬는 시간 · 수업 종료 후</span>
      <h2>클로징</h2>
      <p>오늘 수업한 과정 이후에 열리는 과정을 안내합니다.<br>과정을 고르면 그 교실용 영상이 재생됩니다.</p>
      <div class="meta"><span id="close-meta">과정 고르기</span><span class="play">고르기 ▸</span></div>
    </button>

    <button class="card" id="btn-material">
      <span class="tag gray">자료</span>
      <h2>교재·자료</h2>
      <p>과정별 교재·자료를 내려받습니다.<br>과정을 고르면 파일 목록이 나옵니다.</p>
      <div class="meta"><span id="material-meta">과정 고르기</span><span class="play">고르기 ▸</span></div>
    </button>
  </div>

  <section id="picker">
    <h3>오늘 수업한 과정 고르기</h3>
    <p class="hint">
      고른 과정의 <b>개강일 이후</b>에 열리는 과정만 담긴 영상이 재생됩니다. 폐강된 차수는 빠집니다.<br>
      쉬는 시간과 퇴실 시간에 반복 재생됩니다.
    </p>
    <input id="q" type="search" placeholder="과정명 검색 (예: OpenClaw, Azure, 바이브)" autocomplete="off">
    <div class="list" id="list"></div>
  </section>

  <section id="mpicker">
    <h3>자료 내려받을 과정 고르기</h3>
    <p class="hint">과정을 고르면 그 과정에 올라온 파일 목록이 나옵니다. 파일을 누르면 내려받습니다.</p>
    <input id="mq" type="search" placeholder="과정명 검색" autocomplete="off">
    <div class="list" id="mlist"></div>
  </section>

  <p class="note">
    <b>인터넷이 느린 강의실</b> — <a href="media/opening.mp4" download>오프닝 내려받기</a>
  </p>
</div>

<div id="stage">
  <button id="close" type="button">닫기 (Esc)</button>
  <video id="player" playsinline controls></video>
</div>

<script>
  const stage = document.getElementById('stage');
  const player = document.getElementById('player');
  const picker = document.getElementById('picker');
  const list = document.getElementById('list');
  const q = document.getElementById('q');
  let closings = [];

  function play(src, loop){
    player.src = src;
    player.loop = !!loop;
    stage.classList.add('on');
    const go = player.play();
    if (go && go.catch) go.catch(()=>{});
    if (stage.requestFullscreen) stage.requestFullscreen().catch(()=>{});
  }
  function stop(){
    player.pause();
    player.removeAttribute('src');
    player.load();
    stage.classList.remove('on');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  }
  function mmss(s){
    s = Math.round(s || 0);
    return s >= 60 ? `${Math.floor(s/60)}분 ${s%60}초` : `${s}초`;
  }
  function ymd(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? `${+m[2]}.${+m[3]} 개강` : '';
  }

  // 종료일이 오늘보다 앞선 과정은 목록에서 숨긴다(종료일 당일까지는 보임).
  // 며칠짜리 과정이 중간에 사라지지 않도록 개강일이 아니라 종료일 기준.
  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function isFinished(c){ return !!c.end_day && c.end_day < todayStr(); }

  function render(filter){
    const f = (filter || '').trim().toLowerCase();
    const rows = closings.filter(c => !isFinished(c))
      .filter(c => !f || (c.course + ' ' + c.id).toLowerCase().includes(f));
    list.innerHTML = '';
    if (!rows.length){
      list.innerHTML = '<p class="empty">해당하는 과정이 없습니다.</p>';
      return;
    }
    for (const c of rows){
      const b = document.createElement('button');
      b.className = 'item';
      b.innerHTML = '<b></b><span></span>';
      b.querySelector('b').textContent = c.course || c.id;
      b.querySelector('span').textContent =
        [ymd(c.base_day), `이후 ${c.sessions}차수`, mmss(c.dur)].filter(Boolean).join(' · ');
      b.addEventListener('click', ()=> play('media/closings/' + encodeURIComponent(c.file), true));
      list.appendChild(b);
    }
  }

  fetch('media/closings/closings.json')
    .then(r => r.ok ? r.json() : [])
    .then(d => {
      closings = d;
      const active = closings.filter(c => !isFinished(c)).length;
      document.getElementById('close-meta').textContent =
        active ? `${active}개 과정` : '지금 진행 중인 과정이 없습니다';
      render('');
      const c = new URLSearchParams(location.search).get('c');
      const hit = closings.find(x => x.id === c);
      if (hit) { picker.classList.add('on'); play('media/closings/' + encodeURIComponent(hit.file), true); }
    })
    .catch(()=>{ document.getElementById('close-meta').textContent = '목록을 불러오지 못했습니다'; });

  document.getElementById('btn-open').addEventListener('click', ()=> play('media/opening.mp4', false));
  document.getElementById('btn-close').addEventListener('click', ()=>{
    picker.classList.toggle('on');
    if (picker.classList.contains('on')) { picker.scrollIntoView({behavior:'smooth'}); q.focus(); }
  });
  document.getElementById('close').addEventListener('click', stop);
  q.addEventListener('input', e => render(e.target.value));

  document.addEventListener('keydown', e=>{
    if (e.key === 'Escape' && stage.classList.contains('on')) { stop(); return; }
    if (stage.classList.contains('on') || document.activeElement === q || document.activeElement === mq) return;
    if (e.key === 'o' || e.key === 'O') document.getElementById('btn-open').click();
    if (e.key === 'c' || e.key === 'C') document.getElementById('btn-close').click();
  });
  player.addEventListener('ended', ()=>{ if (!player.loop) stop(); });

  // --- 교재·자료 ---
  const mpicker = document.getElementById('mpicker');
  const mlist = document.getElementById('mlist');
  const mq = document.getElementById('mq');
  let materials = [];

  function fmtSize(bytes){
    if (!bytes) return '';
    const mb = bytes / (1024 * 1024);
    return mb >= 1 ? `${mb.toFixed(1)}MB` : `${Math.round(bytes / 1024)}KB`;
  }

  function renderMaterials(filter){
    const f = (filter || '').trim().toLowerCase();
    const rows = materials.filter(c => !f || (c.course + ' ' + c.id).toLowerCase().includes(f));
    mlist.innerHTML = '';
    if (!rows.length){
      mlist.innerHTML = '<p class="empty">해당하는 과정이 없습니다.</p>';
      return;
    }
    for (const c of rows){
      const box = document.createElement('div');
      box.className = 'mcourse';
      const b = document.createElement('b');
      b.textContent = c.course || c.id;
      box.appendChild(b);
      for (const file of (c.files || [])){
        const row = document.createElement('div');
        row.className = 'mfile';
        const left = document.createElement('span');
        left.textContent = file.name + (file.bytes ? ` · ${fmtSize(file.bytes)}` : '');
        const a = document.createElement('a');
        a.href = 'media/materials/' + file.path.split('/').map(encodeURIComponent).join('/');
        a.textContent = '내려받기';
        a.setAttribute('download', '');
        row.appendChild(left);
        row.appendChild(a);
        box.appendChild(row);
      }
      mlist.appendChild(box);
    }
  }

  fetch('media/materials/materials.json')
    .then(r => r.ok ? r.json() : [])
    .then(d => {
      materials = d;
      document.getElementById('material-meta').textContent =
        materials.length ? `${materials.length}개 과정` : '아직 올라온 자료가 없습니다';
      renderMaterials('');
    })
    .catch(()=>{ document.getElementById('material-meta').textContent = '목록을 불러오지 못했습니다'; });

  document.getElementById('btn-material').addEventListener('click', ()=>{
    mpicker.classList.toggle('on');
    if (mpicker.classList.contains('on')) { mpicker.scrollIntoView({behavior:'smooth'}); mq.focus(); }
  });
  mq.addEventListener('input', e => renderMaterials(e.target.value));
</script>
</body>
</html>
